name: Build and run functional tests using ragger through reusable workflow

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: compiled_app_binaries

  functional_tests:
    name: Cryptocom functional tests
    strategy:
      matrix:
        device: ["nanosp", "nanox", "stax", "flex", "apex_p"]
      fail-fast: false
    needs:
      - build_application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Install js deps
        run: cd tests_zemu && npm install

      - name: Download app binaries
        uses: actions/download-artifact@v7
        with:
          name: compiled_app_binaries
          path: app/build

      - name: Run zemu tests
        run: cd tests_zemu && npm run test -- -t "\(${{ matrix.device }}\)"

      - name: Upload snapshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.device }}-zemu-snapshots
          path: tests_zemu/snapshots-tmp/
